[Match]
Distribution=alinux

[Distribution]
Release=3
Repositories=epel

[Output]
# systemd-repart otherwise picks a 4096-byte filesystem sector size. Kernel 5.10 refuses to
# mount that XFS when the virtio disk reports 512-byte logical sectors.
SectorSize=512

[Content]
# Alibaba Cloud Linux 3 (systemd 239) does not ship an unsigned shim. It does ship a
# systemd-stub of that same vintage, which cannot load UKIs produced by a current ukify.
Bootloader=grub
ShimBootloader=none
UnifiedKernelImages=no
# GRUB 2.02 does not read the SMBIOS kernel-cmdline-extra mkosi passes at runtime, so the
# root stays read-only unless rw is baked into the image command line. Read-only root makes
# dbus fail and the integration check never reports success.
KernelCommandLine=rw

[Runtime]
# Unsigned grub cannot start under the default secure-boot OVMF firmware.
Firmware=uefi
