# SPDX-License-Identifier: LGPL-2.1-or-later

[Match]
Distribution=alinux

[Distribution]
Release=3
Repositories=epel

[Content]
# Alibaba Cloud Linux 3 (systemd 239) does not ship systemd-boot or an unsigned shim.
Bootloader=grub
ShimBootloader=none

[Runtime]
# Unsigned grub cannot start under the default secure-boot OVMF firmware.
Firmware=uefi
