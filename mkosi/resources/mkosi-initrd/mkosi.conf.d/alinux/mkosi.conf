[Match]
Distribution=alinux

# systemd 239 does not isolate initrd.target on its own (default.target still points at
# graphical.target), and nothing orders initrd-switch-root.service after the root mount.
# The extra tree points the initrd at initrd.target and pulls switch-root in after
# initrd-root-fs.target. systemd-remount-fs.service is masked because, on this systemd,
# it forms an ordering cycle with the root fsck and systemd sometimes drops the fsck
# instead of the remount, which leaves the initrd idle without mounting /sysroot.
