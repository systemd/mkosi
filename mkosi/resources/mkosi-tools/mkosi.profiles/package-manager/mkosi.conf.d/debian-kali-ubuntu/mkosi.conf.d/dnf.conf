# dnf5 was removed from Debian testing (and therefore Kali) because of
# https://bugs.debian.org/1153262. Fall back to dnf there until it migrates
# back.

[TriggerMatch]
Distribution=debian
Release=!duke
Release=!unstable

[TriggerMatch]
Distribution=kali

[TriggerMatch]
Distribution=ubuntu

[Content]
Packages=
        dnf
