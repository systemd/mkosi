[Match]
Distribution=fedora

[Content]
Packages=
        btrfs-progs
        distribution-gpg-keys
        dnf5
        dnf5-plugins
        erofs-utils
        pkcs11-provider
        python3-pefile

RemoveFiles=
        # fedora-repos ships the tools tree's own repositories here and dnf5 --use-host-config reads
        # them for every image build, mixing them with the repositories mkosi configures for the target.
        /usr/share/dnf5/repos.d/*
