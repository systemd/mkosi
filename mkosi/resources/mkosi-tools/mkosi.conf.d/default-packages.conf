[Match]
# BuildStream is a generic distribution so we don't know which package to install.
Distribution=!buildstream

[Content]
Packages=
        bash
        ca-certificates
        coreutils
        cpio
        curl
        dosfstools
        e2fsprogs
        keyutils
        kmod
        mtools
        opensc
        openssl
        systemd
        tar
        xfsprogs
        zstd
